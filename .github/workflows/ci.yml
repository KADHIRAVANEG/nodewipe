name: ci
on:
  push:
    branches: ["main", "Features"]
  pull_request:
    branches: ["main", "Features"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies for Tauri GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace
