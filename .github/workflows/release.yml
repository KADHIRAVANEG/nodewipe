name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to current ref or latest tag)'
        required: false

permissions:
  contents: write

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: nodewipe-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: nodewipe-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: nodewipe-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: nodewipe-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nodewipe-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker for Linux aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build CLI
        run: cargo build --release --package nodewipe --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/nodewipe ${{ matrix.asset }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\nodewipe.exe ${{ matrix.asset }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev build-essential

      - name: Install GUI npm deps
        working-directory: gui
        run: npm install

      - name: Build GUI bundle
        working-directory: gui
        env:
          # linuxdeploy (used to build the AppImage) is itself an AppImage,
          # which needs FUSE to run. CI runners commonly lack it; this env
          # var makes it extract-and-run instead of mounting via FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's bundled `strip` predates newer binutils/glibc ELF
          # section types (e.g. .relr.dyn), causing spurious strip failures
          # on newer toolchains. Skipping strip only affects binary size,
          # not functionality.
          NO_STRIP: true
        run: npm run build

      - name: Upload GUI bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            gui/src-tauri/target/release/bundle/**/*.AppImage
            gui/src-tauri/target/release/bundle/**/*.deb
            gui/src-tauri/target/release/bundle/**/*.dmg
            gui/src-tauri/target/release/bundle/**/*.msi
            gui/src-tauri/target/release/bundle/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-checksums:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets and generate SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --dir .
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  update-homebrew:
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nodewipe repo
        uses: actions/checkout@v4

      - name: Update formula and push to homebrew-nodewipe
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Updating Homebrew formula for version ${VERSION}..."
          sed -i "s/version \".*\"/version \"${VERSION}\"/" packaging/homebrew/Formula/nodewipe.rb
          
          git clone "https://github.com/KADHIRAVANEG/homebrew-nodewipe.git" /tmp/homebrew-tap || true
          if [ -d /tmp/homebrew-tap ]; then
            cp packaging/homebrew/Formula/nodewipe.rb /tmp/homebrew-tap/Formula/nodewipe.rb
            cd /tmp/homebrew-tap
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KADHIRAVANEG/homebrew-nodewipe.git"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/nodewipe.rb
            git commit -m "chore(release): bump nodewipe to v${VERSION}" || true
            git push origin main || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-scoop:
    name: Update Scoop Tap
    needs: [build-cli, generate-checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nodewipe repo
        uses: actions/checkout@v4

      - name: Update manifest and push to scoop-nodewipe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Updating Scoop manifest for version ${VERSION}..."
          
          mkdir -p /tmp/scoop-assets
          cd /tmp/scoop-assets
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --pattern "SHA256SUMS" || true
          WIN_HASH=$(grep "nodewipe-windows-x86_64.exe" SHA256SUMS | cut -d' ' -f1 || true)
          echo "Windows binary hash: ${WIN_HASH}"
          
          cd "$GITHUB_WORKSPACE"
          git clone "https://github.com/KADHIRAVANEG/scoop-nodewipe.git" /tmp/scoop-bucket || true
          if [ -d /tmp/scoop-bucket ] && [ -n "$WIN_HASH" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" /tmp/scoop-bucket/bucket/nodewipe.json
            sed -i "s/\"hash\": \".*\"/\"hash\": \"${WIN_HASH}\"/" /tmp/scoop-bucket/bucket/nodewipe.json
            cd /tmp/scoop-bucket
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KADHIRAVANEG/scoop-nodewipe.git"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bucket/nodewipe.json
            git commit -m "chore(release): bump nodewipe to v${VERSION}" || true
            git push origin main || true
          fi

  publish-crates-io:
    name: Publish to crates.io
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish nodewipe-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          echo "Publishing nodewipe-core to crates.io..."
          cargo publish --package nodewipe-core --token "$CARGO_REGISTRY_TOKEN" || echo "nodewipe-core already published"

      - name: Wait for crates.io index propagation
        run: |
          echo "Waiting 30 seconds for nodewipe-core index to update..."
          sleep 30

      - name: Publish nodewipe CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          echo "Publishing nodewipe CLI to crates.io..."
          cargo publish --package nodewipe --token "$CARGO_REGISTRY_TOKEN" || echo "nodewipe already published"
