[package]
name = "nodewipe"
description = "The surgical, blazing-fast dev-environment cleaner written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodewipe"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "nodewipe"
path = "src/main.rs"

[dependencies]
nodewipe-core = { path = "../core", version = "1.0.0" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
walkdir.workspace = true
clap_complete = "4"
self_update = { version = "1.3", features = ["rustls", "checksums"] }
dirs.workspace = true
clap_mangen = "0.2"
cli-clipboard = "0.4"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
tempfile = "3"
