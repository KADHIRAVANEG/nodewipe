<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="0" />
    </radialGradient>

    <!-- Left Pillar Gradients -->
    <linearGradient id="leftPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="30%" stop-color="#9333ea" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="leftFacetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Right Pillar Gradients -->
    <linearGradient id="rightPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="rightFacetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Laser Blade Gradients -->
    <linearGradient id="laserOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#fb7185" />
      <stop offset="75%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="laserCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="intenseBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shardElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Geometric Tech Orbit -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="2" stroke-dasharray="10 16" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="1.5" stroke-dasharray="6 12" />

  <!-- LEFT SHARD (Node / N-Left) -->
  <g filter="url(#shardElevation)">
    <!-- Main Left Pillar Body -->
    <path d="M 116 384 
             L 116 142 
             C 116 122, 132 106, 152 106 
             L 208 106 
             C 224 106, 238 117, 242 133 
             L 242 258 
             L 116 384 Z" 
          fill="url(#leftPillarGrad)" />

    <!-- Top Bevel Highlight Edge -->
    <path d="M 124 138 
             C 124 122, 136 114, 152 114 
             L 208 114 
             C 218 114, 226 120, 230 130 
             L 142 218 
             L 124 200 Z" 
          fill="url(#leftFacetGrad)" opacity="0.35" />

    <!-- Data Module Slots (Storage blocks) -->
    <rect x="146" y="160" width="62" height="10" rx="4" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="146" y="184" width="46" height="10" rx="4" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="146" y="208" width="56" height="10" rx="4" fill="rgba(255, 255, 255, 0.25)" />

    <!-- Tech Circuit Accent -->
    <circle cx="152" cy="242" r="3" fill="#ffffff" opacity="0.7" />
    <line x1="152" y1="242" x2="182" y2="242" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  </g>

  <!-- RIGHT SHARD (Node / N-Right) -->
  <g filter="url(#shardElevation)">
    <!-- Main Right Pillar Body -->
    <path d="M 396 128 
             L 396 370 
             C 396 390, 380 406, 360 406 
             L 304 406 
             C 288 406, 274 395, 270 379 
             L 270 254 
             L 396 128 Z" 
          fill="url(#rightPillarGrad)" />

    <!-- Bottom Bevel Accent -->
    <path d="M 388 374 
             C 388 390, 376 398, 360 398 
             L 304 398 
             C 294 398, 286 392, 282 382 
             L 370 294 
             L 388 312 Z" 
          fill="url(#rightFacetGrad)" opacity="0.3" />

    <!-- Reclaimed Memory Modules -->
    <rect x="304" y="294" width="62" height="10" rx="4" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="320" y="318" width="46" height="10" rx="4" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="310" y="342" width="56" height="10" rx="4" fill="rgba(255, 255, 255, 0.25)" />

    <circle cx="360" cy="270" r="3" fill="#ffffff" opacity="0.7" />
    <line x1="330" y1="270" x2="360" y2="270" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  </g>

  <!-- SURGICAL EXCISION LASER BEAM (The Wipe Slice) -->
  <g filter="url(#intenseBloom)">
    <!-- Deep Aura -->
    <line x1="56" y1="456" x2="456" y2="56" 
          stroke="url(#laserOuter)" stroke-width="26" stroke-linecap="round" opacity="0.45" />

    <!-- Intense Plasma Body -->
    <line x1="56" y1="456" x2="456" y2="56" 
          stroke="url(#laserOuter)" stroke-width="12" stroke-linecap="round" />

    <!-- Pure Core Energy Line -->
    <line x1="56" y1="456" x2="456" y2="56" 
          stroke="url(#laserCore)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- SPARK LENS FLARES -->
  <g filter="url(#subtleGlow)">
    <!-- Top-Right Laser Exit Star -->
    <path d="M 436 76 Q 444 76 444 68 Q 444 76 452 76 Q 444 76 444 84 Q 444 76 436 76 Z" fill="#ffffff" />
    <circle cx="444" cy="76" r="3" fill="#facc15" />

    <!-- Center Cut Flash -->
    <path d="M 248 264 Q 256 264 256 256 Q 256 264 264 264 Q 256 264 256 272 Q 256 264 248 264 Z" fill="#ffffff" />

    <!-- Bottom-Left Entry Star -->
    <path d="M 60 452 Q 68 452 68 444 Q 68 452 76 452 Q 68 452 68 460 Q 68 452 60 452 Z" fill="#ffffff" />
    <circle cx="68" cy="452" r="3" fill="#f43f5e" />
  </g>

  <!-- DISSOLVING RECLAIMED PARTICLES (Debris Vaporization) -->
  <circle cx="396" cy="180" r="4.5" fill="#facc15" filter="url(#subtleGlow)" />
  <circle cx="430" cy="130" r="3" fill="#ffffff" />
  <circle cx="452" cy="100" r="5" fill="#fb923c" filter="url(#subtleGlow)" />

  <circle cx="180" cy="320" r="4" fill="#f43f5e" filter="url(#subtleGlow)" />
  <circle cx="120" cy="380" r="3" fill="#ffffff" />
  <circle cx="82" cy="410" r="5" fill="#a855f7" filter="url(#subtleGlow)" />

  <polygon points="418,200 422,206 416,212 410,206" fill="#38bdf8" opacity="0.9" />
  <polygon points="98,340 102,346 96,352 90,346" fill="#c084fc" opacity="0.9" />
</svg>
