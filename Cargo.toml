[workspace]
resolver = "2"
members = ["core", "cli", "gui/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["KADHIRAVANEG <kadhiravanegk@gmail.com>"]
repository = "https://github.com/KADHIRAVANEG/nodewipe"
homepage = "https://kadhiravaneg.github.io/nodewipe/"
keywords = ["cleanup", "cli", "node_modules", "disk-space", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
nodewipe-core = { path = "core", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1.10"
anyhow = "1"
dirs = "6.0.0"
